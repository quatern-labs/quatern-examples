name: examples

# Every example runs headlessly against the Quatern release pinned in pyproject.toml.
# Examples that need the agent run only when the QUATERN_API_KEY secret is set.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The examples are written for the version pinned in pyproject.toml.
      # If that release is not on PyPI, fail: a green run must mean the examples ran.
      - name: Check the pinned Quatern release is on PyPI
        id: release
        run: python internal/check_pin.py | tee pinned.txt

      - name: Install the pinned Quatern from PyPI
        run: |
          pip install "quatern==$(cat pinned.txt)"
          pip show quatern | grep -E '^(Name|Version)'

      - name: Run every example
        env:
          # Agent examples run only when this secret is set; the runner skips them otherwise.
          QUATERN_API_KEY: ${{ secrets.QUATERN_API_KEY }}
        run: python internal/run_examples.py --agent --logs logs

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-logs
          path: logs/
          if-no-files-found: ignore
